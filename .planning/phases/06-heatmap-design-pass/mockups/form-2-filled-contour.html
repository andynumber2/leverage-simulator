<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Phase 6 mockup: form 2, filled contour</title>
  </head>
  <body>
    <!--
      D-28: no inline copy of the colour mapping here -- this file imports mountMockup, the fixture
      loader, and the form's own paint function from shared/src modules rather than duplicating any
      of their logic, so a palette change re-renders this page automatically. No framework, no
      bundler directive: served as-is by `vite dev` (see 06-01-PLAN.md's "Resolved before
      execution" note 1).
    -->
    <script type="module">
      import { loadSweepFixture, mountMockup } from './shared/mockup-runtime.ts'
      import { FORM_2_GEOMETRY, paintFilledContour } from './forms/form-2-filled-contour.ts'

      const fixture = await loadSweepFixture('./sweep-fixture.bin')

      mountMockup({
        title: 'Filled contour',
        geometry: FORM_2_GEOMETRY,
        paint: (ctx) => paintFilledContour(ctx, fixture, 'multiple'),
      })
    </script>
  </body>
</html>
